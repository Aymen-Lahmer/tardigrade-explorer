<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3f4f4" />
  <title>Proteins details</title>
  <link rel="icon" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/css/pages.css" />
</head>
<body>
  <header class="page-head">
    <a class="brand" href="/">TardiProt <span class="badge">3D</span></a>
    <a class="back" href="/" target="_blank" rel="noopener">Open the viewer ↗</a>
  </header>

  <main class="page">
    <p class="eyebrow">Django database</p>
    <h1>Proteins of the water bear.</h1>
    <p>Every record lives in the local SQLite database and is served by <code>/api/proteins/</code>. The search filters on name, UniProt id and description.</p>

    <input id="protein-search" type="search" placeholder="Dsup, CAHS, trehalose…" aria-label="Search the protein database" />
    <div id="protein-cards" class="cards"></div>
    <p id="proteins-note" class="note">Loading the protein list…</p>
    
  </main>

  <script type="module" src="/static/js/proteins-page.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Explore Proteins</title>

  <!-- CSS du site -->
  <link rel="icon" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/pages.css">
  <link rel="stylesheet" href="/static/css/protein.css">

  <!-- CSS de Mol* -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/molstar@latest/build/viewer/molstar.css">

</head>

<body>

  <!-- HEADER -->
  <header class="page-head">
    <a class="brand" href="/">
      TardiProt <span class="badge">3D</span>
    </a>

    <a class="back" href="/" target="_blank" rel="noopener">
      Open the viewer ↗
    </a>
  </header>


  <!-- BARRE DE RECHERCHE -->
  <section class="protein-search">

    <input type="text" id="protein-search" placeholder="Search a protein (9RKP, 4R5J)..." autocomplete="off">

    <div id="search-results" hidden></div>

  </section>


  <!-- PROTÉINE ACTUELLEMENT AFFICHÉE -->
  <div id="selected-protein">
    Currently displaying: 9RKP
  </div>


  <!-- VIEWER MOL* -->
  <div id="viewer3"></div>


  <!-- BIBLIOTHÈQUE MOL* -->
  <script src="https://cdn.jsdelivr.net/npm/molstar@latest/build/viewer/molstar.js"></script>


  <!-- JAVASCRIPT -->
  <script>

    // 1 LISTE DES STRUCTURES DISPONIBLES

    const proteins = [
        { name: "9RKP", file: "/static/data/9RKP.cif" },
        { name: "4R5J", file: "/static/data/4R5J.cif" },
        { name: "5HVM", file:"/static/data/5HVM.cif"}
    ];


    // 2 INITIALISATION DU VIEWER

    let viewer;

    const viewerPromise = molstar.Viewer.create("viewer3", {
        layoutIsExpanded: false,
        layoutShowControls: false
    });

    viewerPromise.then(async function(v) {

        viewer = v;

        try {
            await loadProtein(proteins[0]);
        } catch (error) {
            console.error("Erreur au chargement initial :", error);
            document.getElementById("selected-protein").textContent =
                "Erreur de chargement : " + error.message;
        }

    });


    // 3 CHARGEMENT D'UNE PROTÉINE
    

    async function loadProtein(protein) {

        // Attendre que le viewer soit prêt
        if (!viewer) {
            viewer = await viewerPromise;
        }

        const builder = molstar.PluginExtensions.mvs.MVSData.createBuilder();

        const structure = builder
            .download({ url: protein.file })
            .parse({ format: "mmcif" })
            .modelStructure({});

        // Représentation des protéines
        structure.component({ selector: "polymer" })
            .representation({ type: "cartoon" })
            .color({ color: "green" });

        // Représentation des ligands
        structure.component({ selector: "ligand" })
            .representation({ type: "ball_and_stick" })
            .color({ color: "#cc3399" });

        const mvsData = builder.getState();

        await molstar.PluginExtensions.mvs.loadMVS(
            viewer.plugin,
            mvsData,
            {
                sourceUrl: undefined,
                sanityChecks: true,
                replaceExisting: true
            }
        );

        document.getElementById("selected-protein").textContent =
            "Currently displaying: " + protein.name;
    }


    // 4 RÉCUPÉRATION DES ÉLÉMENTS HTML

    const searchInput = document.getElementById("protein-search");
    const searchResults = document.getElementById("search-results");


    // 5 AFFICHER LES PROTÉINES DISPONIBLES

    function showProteins(query = "") {

        searchResults.innerHTML = "";

        // Filtrer les protéines selon la recherche
        const results = proteins.filter(function(protein) {
            return protein.name.toLowerCase().includes(query.toLowerCase());
        });

        // Créer un bouton pour chaque protéine
        results.forEach(function(protein) {

            const button = document.createElement("button");

            button.className = "search-result";
            button.textContent = protein.name;

            button.addEventListener("click", async function() {

                searchInput.value = protein.name;
                searchResults.hidden = true;

                document.getElementById("selected-protein").textContent =
                    "Loading: " + protein.name + "...";

                try {

                    await loadProtein(protein);

                } catch (error) {

                    console.error("Erreur de chargement :", error);

                    document.getElementById("selected-protein").textContent =
                        "Error loading " + protein.name + ": " + error.message;
                }

            });

            searchResults.appendChild(button);

        });

        searchResults.hidden = results.length === 0;
    }


    // 6 RECHERCHE

    // Afficher toutes les protéines quand on clique dans la barre
    searchInput.addEventListener("focus", function() {
        showProteins(searchInput.value.trim());
    });

    // Filtrer les protéines quand on écrit
    searchInput.addEventListener("input", function() {
        showProteins(searchInput.value.trim());
    });


    // 7 FERMER LES RÉSULTATS EN CLIQUANT AILLEURS

    document.addEventListener("click", function(event) {

        if (
            !searchInput.contains(event.target) &&
            !searchResults.contains(event.target)
        ) {
            searchResults.hidden = true;
        }

    });

</script>


</body>

</html>
